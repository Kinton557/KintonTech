<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | KintonTech Technologies</title>
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>
<body>

<header>
  <div class="container nav">
    <a class="logo" href="index.html">Kinton<span>Tech</span><small>TECHNOLOGIES</small></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="services.html">Services</a>
      <a href="about.html">About</a>
      <a href="portfolio.html">Work</a>
      <a href="contact.html">Contact</a>
    </nav>
    <a class="button" href="contact.html">Start Project &rarr;</a>
  </div>
</header>

<main>
  <section>
    <div class="container" style="max-width: 680px;">
      <div class="section-heading" style="text-align: center; margin: 0 auto 32px;">
        <div class="eyebrow">Get In Touch</div>
        <h2>Start Your Project</h2>
        <p>Send your requirements directly to our team, or connect immediately over WhatsApp.</p>
      </div>

      <div style="background: var(--panel); border: 1px solid var(--line); padding: 32px; border-radius: var(--border-radius);">
        <form id="contact-form">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" class="form-control" placeholder="Jane Doe" required>
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" class="form-control" placeholder="jane@company.com" required>
          </div>

          <div class="form-group">
            <label for="service">Service Needed</label>
            <select id="service" class="form-control">
              <option value="web">Website Development</option>
              <option value="mobile">Mobile Application</option>
              <option value="branding">Brand & Logo Design</option>
              <option value="other">IT Consulting</option>
            </select>
          </div>

          <div class="form-group">
            <label for="message">Project Overview</label>
            <textarea id="message" class="form-control" placeholder="Describe your project scope, goals, and timeline..." required></textarea>
          </div>

          <button type="submit" class="button" style="width: 100%;">Submit Inquiry &rarr;</button>
          <div id="form-status" style="margin-top: 16px; font-size: 14px; text-align: center;"></div>
        </form>

        <div style="text-align: center; margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--line);">
          <p style="color: var(--muted); font-size: 14px; margin-bottom: 12px;">Prefer direct chat?</p>
          <a class="button outline" href="https://wa.me/263775610805" target="_blank" rel="noopener">
            Chat on WhatsApp (+263 77 561 0805)
          </a>
        </div>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="container footer-row">
    <span>&copy; <span id="current-year"></span> KintonTech Technologies.</span>
    <a href="index.html">Back to Home &rarr;</a>
  </div>
</footer>

</body>
</html>
